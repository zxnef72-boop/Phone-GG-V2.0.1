<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <meta name="theme-color" content="#0a0e1a">
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='icons/logo.png') }}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
  <title>Login — PhoneGG</title>
  <style>
    :root {
      --bg-primary: #0a0e1a;
      --bg-secondary: #111827;
      --bg-tertiary: #1a2332;
      --bg-hover: #1e293b;
      --border: #1e2a3a;
      --border-light: #2a3a4e;
      --text-primary: #e2e8f0;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --accent: #22c55e;
      --accent-hover: #16a34a;
      --accent-light: #123822;
      --danger: #ef4444;
      --danger-bg: rgba(239,68,68,.1);
      --success: #10b981;
      --radius: 10px;
      --radius-sm: 6px;
      --shadow-lg: 0 10px 15px -3px rgba(0,0,0,.3), 0 4px 6px -2px rgba(0,0,0,.2);
      --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { max-width: 100%; overflow-x: hidden; }
    body {
      font-family: var(--font);
      background: radial-gradient(circle at 20% 20%, #0d1424 0%, var(--bg-primary) 55%);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      line-height: 1.5;
    }
    .login-wrap { width: 100%; max-width: 380px; }
    .brand { text-align: center; margin-bottom: 28px; }
    .brand .logo {
      width: 72px; height: 72px; border-radius: 18px;
      overflow: hidden;
      display: inline-flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, var(--accent-light), var(--bg-tertiary));
      border: 1px solid var(--border-light);
      margin-bottom: 14px;
    }
    .brand .logo img { width: 100%; height: 100%; object-fit: contain; }
    .brand h1 { font-size: 22px; font-weight: 700; letter-spacing: .3px; }
    .brand .subtitle { color: var(--text-secondary); font-size: 13px; margin-top: 4px; }

    .card {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-lg);
      padding: 28px 26px;
    }
    .card h2 { font-size: 17px; font-weight: 600; margin-bottom: 4px; }
    .card .hint { color: var(--text-muted); font-size: 12.5px; margin-bottom: 20px; }

    .field { margin-bottom: 16px; }
    .field label {
      display: block; font-size: 12.5px; font-weight: 500;
      color: var(--text-secondary); margin-bottom: 6px;
    }
    .input-group {
      display: flex; align-items: center;
      background: var(--bg-tertiary);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-sm);
      transition: border-color .15s, box-shadow .15s;
    }
    .input-group:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(34,197,94,.15);
    }
    .input-group .icon {
      width: 40px; text-align: center; color: var(--text-muted); font-size: 14px;
    }
    .input-group input {
      flex: 1; background: transparent; border: none; outline: none;
      color: var(--text-primary); font-family: var(--font); font-size: 14px;
      padding: 11px 12px 11px 0;
    }
    .input-group input::placeholder { color: var(--text-muted); }
    .input-group .toggle-pw {
      width: 40px; text-align: center; color: var(--text-muted);
      cursor: pointer; font-size: 13px; background: none; border: none;
    }
    .input-group .toggle-pw:hover { color: var(--text-secondary); }

    .row-between {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 18px; font-size: 12.5px;
    }
    .remember { display: flex; align-items: center; gap: 6px; color: var(--text-secondary); }
    .remember input { accent-color: var(--accent); }
    .row-between a { color: var(--accent); text-decoration: none; }
    .row-between a:hover { text-decoration: underline; }

    .btn-login {
      width: 100%; border: none; border-radius: var(--radius-sm);
      background: var(--accent); color: #fff; font-weight: 600; font-size: 14.5px;
      padding: 12px; cursor: pointer; transition: background .15s;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn-login:hover { background: var(--accent-hover); }
    .btn-login:active { transform: translateY(1px); }

    .alert-error {
      background: var(--danger-bg); border: 1px solid rgba(239,68,68,.35);
      color: #fca5a5; font-size: 12.5px; padding: 10px 12px;
      border-radius: var(--radius-sm); margin-bottom: 16px;
      display: flex; align-items: center; gap: 8px;
    }

    .footer-note {
      text-align: center; margin-top: 20px; font-size: 12px; color: var(--text-muted);
    }
    .footer-note strong { color: var(--text-secondary); }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="brand">
      <div class="logo"><img src="{{ url_for('static', filename='icons/logo.png') }}" alt="PhoneGG"></div>
      <h1>PhoneGG</h1>
      <div class="subtitle">by NefZx — OSINT Toolkit · AI Native Engine</div>
    </div>

    <div class="card">
      <h2>Masuk ke akun kamu</h2>
      <p class="hint">Login diperlukan untuk mengakses tools OSINT & recon.</p>

      {% if error %}
      <div class="alert-error">
        <i class="fa-solid fa-triangle-exclamation"></i>
        <span>{{ error }}</span>
      </div>
      {% endif %}

      <form method="POST" action="{{ url_for('login') }}" autocomplete="off">
        <input type="hidden" name="next" value="{{ request.args.get('next', '') }}">
        <div class="field">
          <label for="username">Username</label>
          <div class="input-group">
            <span class="icon"><i class="fa-solid fa-user"></i></span>
            <input type="text" id="username" name="username" placeholder="Masukkan username" required autofocus>
          </div>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="input-group">
            <span class="icon"><i class="fa-solid fa-lock"></i></span>
            <input type="password" id="password" name="password" placeholder="Masukkan password" required>
            <button type="button" class="toggle-pw" onclick="togglePw()"><i class="fa-solid fa-eye" id="pwIcon"></i></button>
          </div>
        </div>

        <div class="row-between">
          <label class="remember">
            <input type="checkbox" name="remember">
            Ingat saya
          </label>
        </div>

        <button type="submit" class="btn-login">
          <i class="fa-solid fa-right-to-bracket"></i>
          Masuk
        </button>
      </form>
    </div>

    <p class="footer-note"><i class="fa-solid fa-lock"></i> Akses ke <strong>PhoneGG</strong> dibatasi untuk pengguna terdaftar.</p>
  </div>

  <script>
    function togglePw() {
      const input = document.getElementById('password');
      const icon = document.getElementById('pwIcon');
      if (input.type === 'password') {
        input.type = 'text';
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');
      } else {
        input.type = 'password';
        icon.classList.remove('fa-eye-slash');
        icon.classList.add('fa-eye');
      }
    }
  </script>
</body>
</html>
